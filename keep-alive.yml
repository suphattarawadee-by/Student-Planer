    # รันอัตโนมัติทุกๆ 3 วัน เวลา 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Projects
        run: |
          echo "Pinging Project 1 (buayai-i-Care)..."
          curl -s "https://fljiehtwwohbndossavw.supabase.co/rest/v1/" > /dev/null
          
          echo "Pinging Project 2 (Student Planner ครูสุภัทรวดี)..."
          curl -s "https://qiirydpgjzmxwpexydkq.supabase.co/rest/v1/" > /dev/null
          
          echo "All Supabase projects successfully pinged!"
